<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

</head>
<body class="login">
    <header>
       <div class="header-content">
            <div class="logo">
                <img src="img/Hospital_FUTH-logo (1).png" alt="FUTH logo">
                <span class="logo-text">FUTH EMR</span>
            </div>
        </div>
    </header>
    <main>
        <div class="login-container">
            <div class="form-title">
                <h2 class="welcome">Welcome Back</h2>
                <h4 class="sign-in">Sign In</h4>
            </div>
            <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="enter email" name="username" required>
                </div>
                
                <div>
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" value="Password123" required>
                        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.58 10.58A2 2 0 0 0 13.42 13.42"></path>
                                <path d="M9.88 5.08A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a15.7 15.7 0 0 1-4.05 5.26"></path>
                                <path d="M6.61 6.61A15.97 15.97 0 0 0 2 12s3.5 7 10 7a11.6 11.6 0 0 0 5.39-1.61"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember" checked>
                        <span class="custom-checkbox" aria-hidden="true"></span>
                        <label for="remember">Remember Me</label>
                    </div>
                    <a href="" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="login-button" >Login</button>
            </form>

        </div>
 </main>
 <script src="js/main.js"></script>
</body>
</html>
